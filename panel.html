<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilderika Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>🛒 Wilderika Market</h1>
            <p>Panel de Inventario</p>
        </div>

        <p id="bienvenida"></p>

        <input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="buscarProducto()">

        <!-- FORMULARIO (solo administrador) -->
        <div id="seccionAdmin">
            <input type="text" id="producto" placeholder="Nombre del producto">
            <input type="number" id="cantidad" placeholder="Cantidad">
            <input type="number" id="precio" placeholder="Precio">

            <button onclick="guardarProducto()">Guardar Producto</button>
            <p id="mensaje"></p>
        </div>

        <!-- Mensaje (usuarios) -->
        <div id="seccionUsuario">
            <p id="mensajeUsuario"></p>
        </div>

        <!-- Métricas (admin/inventario). En usuario se ocultan a nivel lógico (valores 0) -->
        <h4>Total productos: <span id="totalProductos">0</span></h4>
        <h4>Total inventario: $<span id="totalValor">0</span></h4>

        <!-- Catálogo (admin con cantidad; usuario sin cantidad) -->
        <ul id="listaProductos"></ul>

        <!-- Carrito (solo usuario) -->
        <div id="seccionCarrito">
            <h4>Tu carrito</h4>
            <h4>Total productos en carrito: <span id="totalProductosUsuario">0</span></h4>
            <h4>Total precio: $<span id="totalPrecioUsuario">0</span></h4>
            <ul id="listaProductosUsuario"></ul>
        </div>

        <button onclick="cerrarSesion()">Cerrar sesión</button>

    </div>

    <script src="panel.js"></script>

</body>
</html>
